---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%-d/%m/%Y" }}{% if page.categories %} · {{ page.categories | join: " · " }}{% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <hr>
  <p style="font-size:14px;">
    <a href="{{ '/' | relative_url }}">&larr; Volver al inicio</a>
    &nbsp;·&nbsp;
    <a href="mailto:augustod@gmail.com">augustod@gmail.com</a>
  </p>
</article>

<style>
  .post h1 { margin-bottom: .3em; }
  .post-meta { color: #6a737d; font-size: 14px; margin-top: 0; }
  .post-content table { width: 100%; border-collapse: collapse; margin: 1.2em 0; }
  .post-content th, .post-content td { border: 1px solid #dfe2e5; padding: 8px 10px; text-align: left; vertical-align: top; }
  .post-content th { background: #f6f8fa; }
  .post-content blockquote { border-left: 4px solid #dfe2e5; color: #6a737d; padding-left: 1em; margin-left: 0; }
</style>
